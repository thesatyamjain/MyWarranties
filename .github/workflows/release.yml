name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        description: 'Semantic Version Bump type'
        required: true
        default: 'patch'
        options:
          - patch
          - minor
          - major
          - manual
      version:
        description: 'Manual version tag (only used if bump type is "manual", e.g. v2.0.0)'
        required: false
        default: ''
      release_title:
        description: 'Custom Release Title (optional)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ----------------------------------------------------
  # 1. Bump version & prepare release tag (~10 seconds)
  # ----------------------------------------------------
  prepare-release:
    name: Prepare Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve_version.outputs.tag }}
      commit_sha: ${{ steps.resolve_version.outputs.commit_sha }}
      title: ${{ steps.resolve_version.outputs.title }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag & Semantic Version
        id: resolve_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ github.event.inputs.bump }}" = "manual" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            RAW_VER=$(grep '^version:' pubspec.yaml | head -n1 | cut -d ' ' -f 2)
            BASE_VER=$(echo "$RAW_VER" | cut -d '+' -f 1)
            BUILD_NUM=$(echo "$RAW_VER" | cut -d '+' -f 2)
            if [ -z "$BUILD_NUM" ] || [ "$BUILD_NUM" = "$BASE_VER" ]; then
              BUILD_NUM="1"
            fi
            
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VER"
            BUMP="${{ github.event.inputs.bump }}"
            
            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
              *)
                ;;
            esac
            
            BUILD_NUM=$((BUILD_NUM + 1))
            NEW_VER="$MAJOR.$MINOR.$PATCH"
            NEW_FULL_VER="$NEW_VER+$BUILD_NUM"
            TAG="v$NEW_VER"
            
            echo "Bumping pubspec.yaml to $NEW_FULL_VER"
            sed -i "s/^version: .*/version: $NEW_FULL_VER/" pubspec.yaml
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pubspec.yaml
            git commit -m "chore(release): bump version to $NEW_FULL_VER [skip ci]" || true
            git push origin HEAD:main || true
          fi
          
          TAG=$(echo "$TAG" | xargs)
          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          
          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="My Warranties $TAG"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

  # ----------------------------------------------------
  # 2. Parallel Android Universal APK Builder (~2m)
  # ----------------------------------------------------
  build-android-apk:
    name: Build Android APK
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk my_warranties_android_${{ needs.prepare-release.outputs.tag }}.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-artifact
          path: my_warranties_android_${{ needs.prepare-release.outputs.tag }}.apk
          retention-days: 1

  # ----------------------------------------------------
  # 3. Parallel Android Play Store AAB Builder (~2m)
  # ----------------------------------------------------
  build-android-aab:
    name: Build Android AAB
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab my_warranties_android_${{ needs.prepare-release.outputs.tag }}.aab

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-artifact
          path: my_warranties_android_${{ needs.prepare-release.outputs.tag }}.aab
          retention-days: 1

  # ----------------------------------------------------
  # 4. Parallel Web Release Builder (~1m)
  # ----------------------------------------------------
  build-web:
    name: Build Web Bundle
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web release bundle
        run: |
          flutter build web --release
          cd build/web
          tar -czf ../../my_warranties_web_${{ needs.prepare-release.outputs.tag }}.tar.gz .
          cd ../..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: my_warranties_web_${{ needs.prepare-release.outputs.tag }}.tar.gz
          retention-days: 1

  # ----------------------------------------------------
  # 5. Parallel iOS Build (macOS runner, ~3.5m)
  # ----------------------------------------------------
  build-ios:
    name: Build iOS IPA Package
    needs: prepare-release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release Unsigned IPA
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../my_warranties_ios_${{ needs.prepare-release.outputs.tag }}_unsigned.ipa Payload
          cd ../../..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: my_warranties_ios_${{ needs.prepare-release.outputs.tag }}_unsigned.ipa
          retention-days: 1

  # ----------------------------------------------------
  # 6. Collate Artifacts & Publish GitHub Release (~20s)
  # ----------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-android-apk, build-android-aab, build-web, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          target_commitish: ${{ needs.prepare-release.outputs.commit_sha }}
          name: ${{ needs.prepare-release.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
