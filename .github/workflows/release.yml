name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        description: 'Semantic Version Bump type'
        required: true
        default: 'patch'
        options:
          - patch
          - minor
          - major
          - manual
      version:
        description: 'Manual version tag (only used if bump type is "manual", e.g. v2.0.0)'
        required: false
        default: ''
      release_title:
        description: 'Custom Release Title (optional)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multiplatform Installers and Create GitHub Release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag & Semantic Version
        id: resolve_version
        run: |
          # 1. If triggered by git tag push directly:
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          # 2. If triggered manually:
          elif [ "${{ github.event.inputs.bump }}" = "manual" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            # Read current version from pubspec.yaml
            RAW_VER=$(grep '^version:' pubspec.yaml | head -n1 | cut -d ' ' -f 2)
            BASE_VER=$(echo "$RAW_VER" | cut -d '+' -f 1)
            BUILD_NUM=$(echo "$RAW_VER" | cut -d '+' -f 2)
            if [ -z "$BUILD_NUM" ] || [ "$BUILD_NUM" = "$BASE_VER" ]; then
              BUILD_NUM="1"
            fi
            
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VER"
            BUMP="${{ github.event.inputs.bump }}"
            
            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
              *)
                # Default to existing pubspec version if unspecified
                ;;
            esac
            
            BUILD_NUM=$((BUILD_NUM + 1))
            NEW_VER="$MAJOR.$MINOR.$PATCH"
            NEW_FULL_VER="$NEW_VER+$BUILD_NUM"
            TAG="v$NEW_VER"
            
            echo "Bumping pubspec.yaml to $NEW_FULL_VER"
            sed -i '' "s/^version: .*/version: $NEW_FULL_VER/" pubspec.yaml
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pubspec.yaml
            git commit -m "chore(release): bump version to $NEW_FULL_VER [skip ci]" || true
            git push origin HEAD:main || true
          fi
          
          # Clean tag string
          TAG=$(echo "$TAG" | xargs)
          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          
          # Title
          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="My Warranties $TAG"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run verification test suite
        run: flutter test

      - name: Build Android Release APK (Universal Mobile Installer)
        run: flutter build apk --release

      - name: Build Android App Bundle (Google Play Store AAB)
        run: flutter build appbundle --release

      - name: Build iOS Release (Unsigned IPA / Runner.app archive)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../my_warranties_ios_${{ steps.resolve_version.outputs.tag }}_unsigned.ipa Payload
          cd ../../..

      - name: Build Web release bundle
        run: |
          flutter build web --release
          cd build/web
          tar -czf ../../my_warranties_web_${{ steps.resolve_version.outputs.tag }}.tar.gz .
          cd ../..

      - name: Rename Android Installers with Version
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk my_warranties_android_${{ steps.resolve_version.outputs.tag }}.apk
          cp build/app/outputs/bundle/release/app-release.aab my_warranties_android_${{ steps.resolve_version.outputs.tag }}.aab

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_version.outputs.tag }}
          target_commitish: ${{ steps.resolve_version.outputs.commit_sha }}
          name: ${{ steps.resolve_version.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            my_warranties_android_${{ steps.resolve_version.outputs.tag }}.apk
            my_warranties_android_${{ steps.resolve_version.outputs.tag }}.aab
            my_warranties_ios_${{ steps.resolve_version.outputs.tag }}_unsigned.ipa
            my_warranties_web_${{ steps.resolve_version.outputs.tag }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
