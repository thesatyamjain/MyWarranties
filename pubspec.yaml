name: my_warranties
description: "A modern, privacy-first Flutter application crafted to organize purchase invoices and track warranties."
publish_to: "none"
version: 1.1.18+18

environment:
  sdk: ">=3.11.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.1
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  pdf: ^3.12.0
  pdfx: ^2.11.0
  phosphor_flutter: ^2.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
